name: Install skills locally

on:
  workflow_dispatch:
    inputs:
      skills:
        description: "Skills to install (comma-separated). Leave empty to install all."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  install:
    name: Install skills at project scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Build skill flags
        id: flags
        run: |
          INPUT="${{ inputs.skills }}"
          if [ -z "$INPUT" ]; then
            echo "skill_flags=--skill efficient-fable --skill efficient-frontier --skill quick-recap --skill stay-within-limits --skill visual-plan --skill visual-recap" >> "$GITHUB_OUTPUT"
          else
            FLAGS=$(echo "$INPUT" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | awk '{print "--skill " $0}' | tr '\n' ' ')
            echo "skill_flags=$FLAGS" >> "$GITHUB_OUTPUT"
          fi

      - name: Install skills
        run: |
          npx @agent-native/skills add \
            ${{ steps.flags.outputs.skill_flags }} \
            --client claude-code \
            --scope project \
            --update-instructions \
            --yes

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: install skills at project level"
          git push

      - name: Nothing to do
        if: steps.diff.outputs.changed == 'false'
        run: echo "Skills already up to date — no changes committed."
